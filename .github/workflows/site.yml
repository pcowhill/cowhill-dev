# Validates, tests and builds the website on every pull request and push to
# main, and deploys the verified build artifact to GitHub Pages from main.
#
# - Pull requests: full verification and a production build, no deployment.
# - Pushes to main: full verification, artifact inspection, then deployment of
#   that same artifact. A failed step never replaces the live site.
# - workflow_dispatch: same pipeline; deployment only when run from main.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time; never cancel an in-progress production deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_origin: ${{ steps.pages.outputs.origin }}
      pages_base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Check deployment origin and base path
        run: npm run check:pages-config -- --origin "${{ steps.pages.outputs.origin }}" --base-path "${{ steps.pages.outputs.base_path }}"

      - name: Validate projects.yaml
        run: npm run validate

      - name: Verify committed editor is current
        run: npm run editor:check

      - name: Type check
        run: npm run typecheck

      - name: Unit and publication tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Inspect build output
        run: npm run inspect-dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
