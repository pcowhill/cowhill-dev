        alt: A lesson 5 example comparing G7 and D flat 7 in a ii V I cadence in Jazz voicing mode, with the Dm7 chord sounding and its keys lit on the keyboard.
        caption: Tritone substitution example in Jazz voicing, mid-playback.
      - src: project-assets/claude-jazz-piano-lessons/upper-structure-explorer.png
        alt: The upper-structure explorer from lesson 8 with buttons for four triads over an F7 foundation, a table mapping triad notes to chord functions and notation below.
        caption: The upper-structure explorer in the diminished systems lesson.
    links:
      - label: Visit Jazz Piano Theory Atlas
