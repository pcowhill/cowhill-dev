      - label: Visit GitHub Repo
        url: https://github.com/pcowhill/claude-fluid-game
    description: |
      This was one of the first prototype applications that I used Claude Code to implement.  In the early tests that I ran, I started out using Claude Opus 4.8 (since Fable 5 was removed from public availability for a time).  I was aiming to test how well Claude Code would be able to reproduce a simple browser game that I had played a lot, and the game I chose was Creeper World.

      Over the course of a handful of iterations, I got closer to the type of experience I was hoping for.  I learned that Claude Code's ability to generate graphics and work toward a known goal is fairly reliable.  However, one thing that was certainly not reliable was getting the "feel" of the game right.  I found that Claude Code tended to make the game trivially easy until I continually pressed it to make the game more challenging and to force me to interact with the different elements of the game.
