  - id: instrument-of-the-day
    title: Instrument of the Day
    summary: Every day, a different recording will be selected, and you will have six guesses to identify the instrument.
    tags: [game, audio, music, website]
    status: complete
    draft: false
    added: 2024-08-18
    updated: 2024-08-18
    description: |
      In this project, I explored the world of daily puzzle games in a unique subject area that is at the intersection of multiple interests for me: a musical instrument guessing game.  Similar to games like Wordle or Worldle, there is a correct instrument players are encouraged to guess, and their only information is a audio recording of that instrument playing.  This site features a variety of instruments like the more common guitar, piano, and trumpet to the lesser known (at least in the west) erhu, carillon, and pipa.

      Recordings are all sourced from public domain recordings available on IMSLP, and they covered a wide variety of instruments, styles, composers, and periods in musical history.  This was a fun experiment for exploring early game concepts that I would be proud to share with friends and see who is the most musically knowledgable.
    links:
