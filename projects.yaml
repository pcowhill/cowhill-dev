    description: As I grew in interest of DnD, I wanted to see how Claude Code would fair attempting to create a game similar to Baldur's Gate.  This was also to experiment with how AI would implement a very well established but complicated interacting web of game rules into a single prototype.  I iteratively played the game and provided feedback.  It did an okay job, but there were certainly some rough edges.  It did its best on the visual style, and there were many, many bugs to sort through.  In its current state, it is playable, but there is the problem that has been encountered in other game-type prototypes that while it technically hits all the requirements it does not "feel" like a fun game.  I am curious to how these models would get better at this type of task over time.

  - id: claude-repo-steward
    title: Repo Steward
    summary: A simulated GitHub-style repository with an AI steward that reacts to issues and pull requests, where a deterministic policy engine decides which proposals run automatically, wait for approval, or are blocked.
    tags: [website, interactive, demonstration, engineering]
    status: complete
    draft: false
    added: 2026-07-14
    updated: 2026-07-14
    thumbnail:
      src: project-assets/claude-repo-steward/thumbnail.png
      alt: "Issue #42 in the simulated orbitops/readiness-tracker repository, with labels the steward bot just added and a Repo Steward panel summarising the bug and its confidence."
    screenshots:
      - src: project-assets/claude-repo-steward/steward-inbox.png
        alt: The Steward Inbox listing two pending proposals, Remove needs-repro and Mark as ai-candidate, each with a confidence bar, the policy rule that applied and Approve and Reject buttons.
        caption: Proposals that policy routes to a human wait in the Steward Inbox with the rule that decided it.
      - src: project-assets/claude-repo-steward/pull-request-review.png
        alt: "Pull request #47 conversation view with commits, a reviewer comment and a Repo Steward panel summarising the fix and the remaining test gap."
        caption: "The pull request steward scenario after analysis of PR #47."
    links:
      - label: Visit Repo Steward
        url: https://pcowhill.github.io/claude-repo-steward/
        primary: true
      - label: Visit GitHub Repo
        url: https://github.com/pcowhill/claude-repo-steward
    description: |
      One of the topics that I have been hearing more and more is how AI can be used productively in the software engineering process.  I found that many of these discussions suffered from the fact that my peers I was talking to often had different visions of theoretical situations involving AI.  While one developer may see an AI-enhanced process going well in how *they* envision it, another developer may see an AI-enhanced process going poorly when *they* envision it.  This is not particularly helpful, because the specifics of how AI is enhancing the process may not be very well defined.  Therefore assessing the potential benefits and risks is a very difficult task.

      The purpose of this project was an attempt to give one potential outlook for how an AI agent may help in the process of pursuing tickets, reviewing pull requests, and updating documentation based on new code.  This project aimed to demonstrate the ways in which AI can provide value and benefit to developers in real ways.

