  - id: claude-banking-project
    title: Meridian Simulated Banking Platform
    summary: A simulated consumer bank with a public website, a customer portal, an internal operations console, and a backend whose ledger derives every balance from append-only entries. Runs locally only; not deployed.
    tags: [simulation, website, interactive, text, demonstration, server]
    status: complete
    draft: false
    added: 2026-06-29
    updated: 2026-06-29
    thumbnail:
      src: project-assets/claude-banking-project/thumbnail.png
      alt: Meridian customer dashboard for Avery Customer showing total available cash of $19,452.68, an Everyday Checking card and a Goal Savings card with available and current balances, and a Loans & CDs section below.
    screenshots:
      - src: project-assets/claude-banking-project/public-home.png
        alt: Meridian public home page with the headline 'Modern banking that keeps you on course', a family photo, Open account and Log in buttons, and a simulation disclaimer banner across the top.
        caption: The public marketing site that fronts the customer portal.
      - src: project-assets/claude-banking-project/account-transactions.png
        alt: Everyday Checking account page showing available and current balances, pending-out, on-hold and pending-in amounts, a transaction search box with status and category filters, and pending entries for a bill payment, a card authorization and a mobile check deposit.
        caption: Account detail with pending and posted ledger entries, search and filters.
      - src: project-assets/claude-banking-project/ops-request-queues.png
        alt: Dark-themed operations simulator showing the Request queues page with status and lane filters and work-item cards for an identity check and a fraud alert, each with Approve, Reject, Hold and Request info buttons.
        caption: The operations console where staff approve, reject or hold simulated bank work items.
    links:
      - label: Visit GitHub Repo
        url: https://github.com/pcowhill/claude-banking-project
        primary: true
    description: |
      ## Introduction

      Up until this point, all of the projects that I pursued with Claude Code were relatively small prototypes.  Many of them were one-shots, and a few others iterated over a few steps to fix up some bugs or implement my preferences.  I desired for this next project to reveal how far one engineer can push the current frontier AI development tools.  Because of this, I deliberately chose something too large to treat as a toy example: a simulated banking platform with multiple interfaces, workflows, and interacting systems.

      ## Approach

      I started with a design planning session within ChatGPT.  Over the course of discussion, exploration, and interviewing, the plan for this entire experiment was composed.  The plan included splitting up the implementation of a simulated banking platform into multiple discrete steps.  Each step would thoroughly implement a certain subset of features and test them end-to-end before preparing the next step.  In between steps, I would have an opportunity to test the current iteration of the application and provide feedback on how it is going as well as report any bugs if I found them.  After 10 of these steps, the first 1.0 major release version would be complete.

      I used Claude Code to implement each new version of this application.  The prompt for the next session would be composed from the previous Claude Code session, and it would include a section for me to add my feedback to the next prompt.  Additionally, it would provide me specific testing instructions to point me to the new features available in this version so that I could test them to my satisfaction.

      ## Results

      Overall, this experiment was a glowing success.  The resulting banking application and other capabilities surrounding it exceed my expectations.  Furthermore, the process of creating this was very straight forward and easy to accomplish.  I never felt like I personally had to perform too much work myself, and I feel as though the product that I received is very aligned to what I had envisioned when I started.

      There was one instance in version 0.6.0 in which there was a bug that I found, and it took two iterations for Claude Code to finish fixing it.  However, apart from that, there were no unexpected speed bumps in this process.

      The results of this test go beyond just the resulting banking application.  I could have chosen anything for this project; a banking application was just a good complicated system to demo as many people are already familiar of what a banking application should do and what features should be present.  The most important finding from this experiment is that this *process* was successful.  The waterfall-type approach of building complex software with AI tools was definitely effective.  In just under a regular workweek, I went from idea to operational prototype.  I see no reason why this process could not reproduce all kinds of complicated software.

