  - id: instrument-of-the-day
    title: Instrument of the Day
    summary: Each day, a different recording is selected, and you have six guesses to identify the instrument.
    tags: [game, audio, music, web, interactive, puzzle]
    status: complete
    draft: false
    added: 2024-08-18
    updated: 2024-08-18
    description: |
      In this project, I explored the world of daily puzzle games in a unique subject area that sits at the intersection of several of my interests: a musical instrument guessing game.  Similar to games like Wordle or Worldle, there is a correct instrument that players try to guess, and their only information is an audio recording of that instrument playing.  This site features a variety of instruments, from the more common guitar, piano, and trumpet to the lesser-known (at least in the West) erhu, carillon, and pipa.

      The recordings are all sourced from public-domain material available on IMSLP, and they cover a wide variety of instruments, styles, composers, and periods in musical history.  This was a fun experiment in exploring early game concepts, and one I was proud to share with friends to see who is the most musically knowledgeable.
    thumbnail:
