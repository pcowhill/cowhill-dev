    description: |
      One of the first prototype applications that I utilized Claude Code to implement.  In the early tests that I ran, I started utilizing Claude Opus 4.8 (since Fable 5 was removed from public offering for a time).  I was aiming to test how well Claude Code would be able to reproduce a simple browser game that I had played considerably, and the game I chose was Creeper World.

      Over the course of a handful of iterations, I got closer to the type of experience I was hoping for.  I learned that Claude Code's ability to generate graphics and work toward and known goal are fairly reliably.  However, one thing that was certainly not reliable was getting the "feel" of the game right.  I found that Claude Code tended to make the game trivially easy until I continually pressed it to make it more challenging and forcing me to interact with the different elements of the game.
