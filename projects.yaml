    description: |
      I have had the opportunity to experiment with physical breadboards both in my educational pursuits and my personal ventures.  I find the process to be very enjoyable, and building little circuits can be a very educational way to build a foundation for understanding computer engineering and computer science.  The purpose of this application was to simulate the experience of playing around with a breadboard.

      The thing that surprised me the most about this project is how feature-rich the resulting application became.  In the planning session that I had with ChatGPT, I mostly took the attitude of just wanting to see a breadboard simulator and gave the AI the mentally taxing task of coming up with creative features to add for me to approve.  It decided to include various additional circuit components, lessons for learning how to use some of the complicated components, block-based programming akin to Scratch for the Arduino, time controls, automatic issue debugging for the circuit, and more.  As a nerd for this type of low-level circuitry, it is very easy to get lost having fun in this application.

