  - id: lightsail-demo
    title: Lightsail Demo
    summary: A live chat room, collaborative drawing app, and multiplayer bird game created to explore the capabilities of AWS Lightsail.
    tags: [game, web, chat, server-backed, graphics, interactive, experiment]
    status: complete
    draft: false
    added: 2025-07-21
    updated: 2026-09-22
    description: |
      # Intent
      In mid-2025, I first acquired an AWS Lightsail instance to explore projects that would require a server to function.  I was interested in learning more about building server-client programs that used a back-end WebSocket connection, especially with an eye toward tools that enable interaction between multiple users.

      # The Apps
      This project consists of three different apps that each contribute to the tools and processes for enabling server-client programs on an AWS Lightsail instance.

      ## WebSocket Chat
      A global chat room where all connected users can chat with one another.  Messages sent by one user are automatically delivered to all connected users.  A message-history database was intentionally left out, so users only receive chat messages that were sent after they connected.

      ## WebSocket Draw
      A global drawing application where all connected users can contribute to a shared canvas and download the resulting art.  Similar to WebSocket Chat, a database was not used, and users only receive strokes made after they connected.  This was to limit the staying power of any undesirable art from uncouth users.

      ## WebSocket Game
      A multiplayer game where users can play as birds roaming around their nest to collect worms for extra energy.  This project was a more fun journey than the previous two, and it encouraged me to come up with resource-efficient methods for handling character movement across websocket connections.
    thumbnail:
      src: project-assets/lightsail-demo/thumbnail.png
      alt: The Lightsail Tower landing page with buttons for the chat, draw and game apps
    screenshots:
      - src: project-assets/lightsail-demo/websocket-game.png
        alt: Birds and worms scattered around a nest in the WebSocket Game
        caption: Several birds gathering worms around the shared nest in WebSocket Game.
      - src: project-assets/lightsail-demo/websocket-draw.png
        alt: A house and sun drawn on the shared WebSocket Draw canvas
        caption: A quick sketch on the shared canvas of WebSocket Draw.
      - src: project-assets/lightsail-demo/websocket-chat.png
        alt: A short conversation in the WebSocket Chat room
        caption: A conversation in the global WebSocket Chat room.
