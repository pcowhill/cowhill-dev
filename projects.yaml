  - id: city-guesser
    title: City Guesser Game
    summary: A game of correctly identifying cities in the USA to reveal more of the map and uncover as many cities as possible.
    tags: [game, website]
    status: complete
    draft: false
    thumbnail:
      src: project-assets/city-guesser/thumbnail.png
      alt: A map of the USA with revealed cities shown as blue circles
    screenshots:
      - src: project-assets/city-guesser/revealed-map.png
        alt: The city map after naming about fifty cities, with the score board below
        caption: After naming around fifty cities, most of the country is revealed and the score board tracks progress.
    links:
      - label: Visit City Guesser
        url: https://pcowhill.github.io/CityGuesser/
        primary: true
      - label: Visit GitHub
        url: https://github.com/pcowhill/pcowhill.github.io/tree/main/CityGuesser
    added: 2024-05-18
    updated: 2024-05-18
    description: |
      This game is mostly inspired from another game online with a very similar structure: guess cities in the United States, each one reveals neighboring cities within some radius, and revealing the entire map is the way to win the game.  The problem I faced is that the site that hosted this game only allowed people to play it on certain days of the month.  The next day it would be available would have been multiple weeks away, and so I decided to just make a version of the game myself!

      With the geospatial experience I gained from my work, I could comfortably load up some geographic datasources (coordinates of the borders of the states and separately coordinates of the cities in the USA), draw them onto a map for the user to see, and wrap a simple geometry game on top.  Based on the statistics of what came with the city data, different metrics are tracked and presented to the user as goals to strive for.  This includes # of revealed states, # of named states, and even total number of revealed states (which is the main goal of the game).  For the overachiever out there, you can also try to name every city in the entire USA, though I think my record on that is only about 10%.

  - id: qt-template
    title: Qt Template
    summary: Sample graphical projects like a File Editor, a 3D Viewer, a fun Tic Tac Toe game, and the Image Draw app.
    tags: [game, graphics, utility, text, 3d]
    status: complete
    draft: false
    thumbnail:
      src: project-assets/qt-template/thumbnail.png
      alt: A collage of the File Editor, Rotate 3D, Tic Tac Toe and Image Draw apps
    screenshots:
      - src: project-assets/qt-template/file-editor.png
        alt: The File Editor showing a configuration file
        caption: File Editor with a configuration file open.
      - src: project-assets/qt-template/rotate-3d.png
        alt: Rotate 3D showing a colorful rhombic dodecahedron
        caption: Rotate 3D cycling through its built-in models.
      - src: project-assets/qt-template/rotate-3d-stl.png
        alt: Rotate 3D rendering a low-poly dog key chain model
        caption: A custom STL model loaded into Rotate 3D.
      - src: project-assets/qt-template/tic-tac-toe.png
        alt: Tic Tac Toe announcing that X has won
        caption: Tic Tac Toe with a winner dialog.
      - src: project-assets/qt-template/image-draw.png
        alt: Image Draw with a hand-drawn cube
        caption: Image Draw with a hand-drawn cube.
    links:
      - label: Visit Github
        url: https://github.com/pcowhill/QtTemplate/tree/main
        primary: true
    added: 2025-03-21
    updated: 2025-03-21
    description: |
      At work around this time, I was getting closer exposure to graphical desktop applications both through the use of Qt and by virtue of participating in a TkInter book club.  To explore the power of these types of tools and gain experience in creating my own applications, I decided to make template examples of Qt applications that I could pull from in the future when making desktop GUI apps.

      # The Templates

      Each template aimed to be similar to a unique type of project I would be interested in creating in the future.

      ## File Editor

      A basic file editor, following a similar visual style to VScode, allows the opening and saving of plaintext files and editing the contents of them.

      ## Rotate 3D

      An OpenGL rendering app that can show a variety of 3D objects rotating in the windows.  Four examples are provided: a simple triangle, a cube, a rhombic dodecahedron, and an open-source dog key chain model.  Additionally users can upload their own. The meshes are dynamically colored, and ghe rotation is configured to show every angle of an object.

      ## Tic Tac Toe

      A simple game of tic tac toe, laying out a framework for handling mouse clicks, canvas rendering, and game logic.

      ## Image Draw

      A Paint-inspired app for drawing and saving simple images.

  - id: harmony-glide
    title: Harmony Glide
    summary: "My first iOS project: a simple color matching game to play on an iPad."
    tags: [game, ios, audio, graphics, music, video]
    status: complete
    draft: false
    thumbnail:
      src: project-assets/harmony-glide/thumbnail.jpg
      alt: A Harmony Glide level with colored squares and matching rings
    screenshots:
      - src: project-assets/harmony-glide/drag-controls.jpg
        alt: A tutorial level with a red square and red rings
        caption: "Simple drag controls: unlock each layer of every goal."
      - src: project-assets/harmony-glide/color-matching.jpg
        alt: A level with blue and red squares and rings
        caption: "Color and coordination: match the hue of the square and goal."
      - src: project-assets/harmony-glide/overcome-challenges.jpg
        alt: A harder level with many colors and moving goals
        caption: Later levels add more colors, more goals and movement.
      - src: project-assets/harmony-glide/level-select.jpg
        alt: The level select screen listing tutorial, easy, medium and hard levels
        caption: Twelve handcrafted levels, each with multiple stages.
    links:
      - label: Visit GitHub
        url: https://github.com/pcowhill/HarmonyGlide
        primary: true
    added: 2025-06-19
    updated: 2025-06-19
    description: |
      Harmony glide is an approachable, musical puzzle game aimed at kids ages 1-4 to build motor coordination and musical curiosity.  Players drag colored squares onto the matching ring which triggers a musical note.  Matching all the rings in a level completes it.  The game comes with 12 handcrafted levels, each with multiple stages.  As levels get harder, new mechanics like multiple colors, layered rings, and moving goals are introduced.

      Having discovered a curiosity for apps on Apple products, I wanted to try my hand at gaining some experience with Mac development, XCode, and Swift.  This was a fun project to work on, and I got to learn about some of the unique conventions found in iOS development.  Since I did not want to pay the annual fee to have this game on the App Store, it is not available there.  But, anyone with a Mac can download the code, compile it, and load it onto an iPad to play!
    notice: iPad Application

