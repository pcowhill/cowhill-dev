        primary: true
      - label: Visit GitHub Repo
        url: https://github.com/pcowhill/claude-jazz-piano-lessons
    description: |
      In this experiment, I wanted to see how well I could leverage Claude Code to interactively learn about a topic I have been interested in learning more about.  As a pianist, I am always seeking to deepen my understanding of applicable jazz music theory.  I was curious to learn more about the origin of Barry Harris style sixth-diminished scales, and I used Claude to produce an interactive tool for learning them.

      I was very pleased with how this turned out.  I originally instructed Claude to make a ladder of lessons that worked up to this complicated music theory concept just in case it got stuck along the way, but it nailed every step.  The piano and interactive and adjustable lessons are very helpful for learning.  Sure, there could be some polish and improvements, but for a one-shot I would have loved to have something like this when learning in college.

