      One topic I have been hearing about more and more is how AI can be used productively in the software engineering process.  I found that many of these discussions suffered from the fact that the peers I was talking to often had different visions of hypothetical situations involving AI.  While one developer may see an AI-enhanced process going well as *they* envision it, another developer may see an AI-enhanced process going poorly as *they* envision it.  This is not particularly helpful, because the specifics of how AI is enhancing the process may not be very well defined.  Therefore, assessing the potential benefits and risks is a very difficult task.

      The purpose of this project was to present one potential outlook on how an AI agent may help in the process of pursuing tickets, reviewing pull requests, and updating documentation based on new code.  This project aimed to demonstrate ways in which AI can provide real value and benefit to developers.

