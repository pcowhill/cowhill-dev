    title: Clef Sheet Music Editor
    summary: "A browser sheet-music editor in the spirit of MuseScore: enter notes on the staff, add staves with instrument presets, dynamics, and lyrics, and export a vector PDF."
    tags: [web, interactive, audio, music, tool, experiment, editor, AI experiment]
