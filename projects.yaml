  - id: lightsail-demo
    title: Lightsail Demo
    summary: A live chat room, collaborative drawing app, and multi-player bird game created to explore the capabilities of AWS Lightsail.
    tags: [game, website, chat, server, graphics, interactive, text]
    status: complete
    draft: false
    added: 2025-07-21
    updated: 2026-09-22
    description: |
      # Intent
      Mid-2025 was when I first acquired an AWS Lightsail instance for the purpose of exploring projects that would require a server to function. I was interested in learning more about building server-client programs that utilized a back-end websocket connection, especially for the prospect of tools that enable interaction between multiple users.

      # The Apps
      This project consists of three different apps that each contribute to the tools and processes for enabling server-client programs on an AWS lightsail instance.

      ## Websocket Chat
      A global chat room where all connected users can chat with one another.  Messages sent by one user are automatically delivered to all connected users.  A database with a message history was intentionally not used so users only receive chat messages that were sent after they connected.

      ## Websocket Draw
      A global drawing application where all connected users can contribute to a shared canvas and download the resulting art.  Similarly to Websocker Chat, a database was not used and only strokes made after a user connected would be received.  This was to limit the staying power of any undesirable art from uncouth users.

      ## Websocket Game
      A multi-player game where users can play birds roaming around their nest to collect worms for extra energy.  This project was a more fun journey than the previous two projects, and it encouraged me to come up with resource-efficient methods for handling character movement across websocket connections.
    thumbnail:
      src: project-assets/lightsail-demo/thumbnail.png
      alt: The Lightsail Tower landing page with buttons for the chat, draw and game apps
    screenshots:
      - src: project-assets/lightsail-demo/websocket-game.png
        alt: Birds and worms scattered around a nest in the WebSocket Game
        caption: Several birds gathering worms around the shared nest in WebSocket Game.
      - src: project-assets/lightsail-demo/websocket-draw.png
        alt: A house and sun drawn on the shared WebSocket Draw canvas
        caption: A quick sketch on the shared canvas of WebSocket Draw.
      - src: project-assets/lightsail-demo/websocket-chat.png
        alt: A short conversation in the WebSocket Chat room
        caption: A conversation in the global WebSocket Chat room.
