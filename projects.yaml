        primary: true
      - label: Visit GitHub Repo
        url: https://github.com/pcowhill/claude-music-notation
    description: |
      This experiment I ran with Claude Code was to test the ability of Claude Code to work more in an agile-based way with shifting or growing requirements instead of a one-shot way (which is how I saw many experiments online disproportionately being attempted).  The theme I chose was a sheet music transcription application in the browser as I am familiar with similar tools like MuseScore, Finale, and Sibelius.  Consistent with the spirit of this experiment, I would attempt to create an MVP sheet music transcription application and would iteratively ask for more and more features to be added.  Only a few iterations were eventually performed, and it taught me about how Claude Code performs in this type of experiment as compared to a one-shot.

      I found that Claude Code successfully added the new features that I requested.  One interesting thing is that it seems Claude Code tended to be hesitant to change what previously existed in the code, even if refactoring a portion would result in fewer files or lines of code with the same functionality.  This potentially can be seen as a good thing in general since if Claude Code is working on a baseline, it should aim to try to keep that baseline as similar as possible after an incremental change to not introduce unanticipated behavior and refactor something that is already familiar to developers.  However, in a project like this where Claude Code has full control over the code, it could potentially be a better strategy in the future to encourage Claude Code to perform refactors as long as it is confident in them and have a thorough test suite to ensure there is no drift in capabilities or introduction of bugs within these refactors.

