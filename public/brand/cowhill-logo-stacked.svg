  <title id="logo-title">cowhill.dev</title>
  <desc id="logo-description">A dark charcoal cow with rounded ears, a softly shaped muzzle, a curved tail, and four sculpted legs stands on a sweeping sage-green hill, partly in front of a warm sand-colored sun. Below, a bold, softly rounded lowercase wordmark reads cowhill.dev. The cow and cowhill share the same charcoal color; the hill and .dev share the same green. The background is transparent.</desc>

